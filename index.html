<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授权完成</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 24px 16px; background: #f6f6f4; color: #222; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { line-height: 1.6; margin: 8px 0; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; font-family: monospace; font-size: 13px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; }
  button { margin-top: 12px; width: 100%; padding: 14px; font-size: 16px; border: 0; border-radius: 8px; background: #222; color: #fff; }
  .err { color: #b00020; }
  .ok { color: #1b7f3b; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title">正在读取授权结果…</h1>
  <p id="msg"></p>
  <textarea id="out" readonly></textarea>
  <button id="copy">复制</button>
  <p style="font-size:13px;color:#666">把复制的内容发到电脑上，在命令行运行：<br><code>python tk_verify.py add "粘贴的内容"</code><br>授权码几分钟内就会失效，请尽快完成。</p>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var t = document.getElementById('title'), m = document.getElementById('msg'), o = document.getElementById('out');
  if (q.get('code')) {
    t.textContent = '授权成功'; t.className = 'ok';
    m.textContent = '下面是授权码，点"复制"后发到电脑。';
    o.value = 'code=' + q.get('code') + '&state=' + (q.get('state') || '');
  } else if (q.get('error')) {
    t.textContent = '授权未完成'; t.className = 'err';
    m.textContent = '错误：' + q.get('error') + '  ' + (q.get('error_description') || '');
    o.value = location.search;
  } else {
    t.textContent = '这里是 TikTok 授权回调页';
    m.textContent = '页面正常。授权完成后会自动跳转到这里并显示授权码。';
  }
  document.getElementById('copy').onclick = function () {
    o.select();
    if (navigator.clipboard) navigator.clipboard.writeText(o.value);
    else document.execCommand('copy');
    this.textContent = '已复制';
  };
</script>
</body>
</html>
